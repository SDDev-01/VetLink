spring.application.name=vetlink-backend
server.port=8080

# ----- Base de datos MySQL (importa database/mydb.sql antes de arrancar) -----
spring.datasource.url=jdbc:mysql://localhost:3306/mydb?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
# En desarrollo local, usamos update para que Hibernate complete columnas/tablas
# pendientes cuando la base mydb no está totalmente sincronizada con las entidades.
# Si deseas validar estrictamente el esquema, cambia esto a validate y aplica las migraciones SQL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# mydb.sql usa columnas en camelCase literal (idArchivo, numeroDocumento...).
# Sin esto, Hibernate las convierte a snake_case (id_archivo) y la validacion
# del esquema falla porque esa columna no existe con ese nombre.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ----- Thymeleaf -----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ----- Subida de archivos (fotos de mascotas, adjuntos del historial) -----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
vetlink.uploads.dir=uploads

# ----- Logging -----
logging.level.org.springframework.security=INFO
logging.level.com.vetlink=DEBUG

