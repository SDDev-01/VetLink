spring.application.name=vetlink-backend
server.port=8080

# ----- Base de datos MySQL -----
# Valores por defecto para ejecución local.
# Compose sobrescribe estas propiedades mediante variables de entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vetlink?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vetlink_spring}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
# Hibernate valida el esquema, pero no lo modifica.
# Los cambios se gestionan mediante database/mydb.sql y migraciones SQL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mantener los nombres originales de las columnas camelCase.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ----- Thymeleaf -----
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ----- Nginx / Proxy inverso -----
server.forward-headers-strategy=framework

# ----- Subida de archivos -----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
vetlink.uploads.dir=${VETLINK_UPLOADS_DIR:uploads}

# ----- Logging -----
logging.level.org.springframework.security=INFO
logging.level.com.vetlink=DEBUG

# ----- Servicio de pasaportes (FastAPI, docs-service) -----
# En Compose: VETLINK_DOCS_BASE_URL=http://fastapi:8000 y el token compartido con FastAPI.
vetlink.docs.base-url=${VETLINK_DOCS_BASE_URL:http://localhost:8000}
vetlink.docs.internal-token=${VETLINK_DOCS_INTERNAL_TOKEN:}

# ----- Reglas de negocio (ver REGLAS_NEGOCIO.md) -----
# Cada valor se puede sobrescribir con una variable de entorno, p. ej. VETLINK_REGLAS_MARGENINICIOATENCIONMIN=20
vetlink.reglas.zona-horaria=${VETLINK_ZONA_HORARIA:America/Bogota}
vetlink.reglas.duracion-servicio-por-defecto-min=30
vetlink.reglas.anticipacion-minima-reserva-min=60
vetlink.reglas.anticipacion-minima-liberacion-min=120
vetlink.reglas.margen-inicio-atencion-min=15
vetlink.reglas.expiracion-pendiente-horas=24
vetlink.reglas.confirmacion-antes-del-inicio-min=30
vetlink.reglas.horizonte-agenda-dias=14
vetlink.reglas.recordatorio-horas-antes=24
vetlink.reglas.tamano-maximo-adjunto-mb=10
vetlink.reglas.tamano-maximo-imagen-mb=2
vetlink.reglas.formatos-adjuntos=pdf,jpg,jpeg,png
vetlink.reglas.public-base-url=${PUBLIC_BASE_URL:http://localhost}
vetlink.reglas.tareas-habilitadas=${VETLINK_TAREAS_HABILITADAS:true}
vetlink.reglas.cron-generacion=0 15 0 * * *
