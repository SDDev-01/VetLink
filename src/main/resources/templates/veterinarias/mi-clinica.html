<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi veterinaria | VetLink</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-body"><aside th:replace="~{layout/dashboard-shell :: sidebar('Panel veterinario', ${navItems}, ${seccionActiva})}"></aside><main class="main-content"><header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Mi veterinaria')}"></header><section class="container"><div class="vl-section vl-section-active"><div class="vl-social-profile-header"><div class="vl-social-avatar">🏥</div><div><h2 th:text="${veterinaria.nombre}"></h2><p th:text="${veterinaria.descripcion}"></p></div></div><div class="vl-card-grid" style="margin-top:24px"><article class="vl-entity-card"><div class="vl-form-section-title">Servicios</div><div class="vl-tag-row"><span class="vl-tag" th:each="s:${servicios}" th:text="${s.servicio.nombreServicio}"></span></div></article><article class="vl-entity-card"><div class="vl-form-section-title">Información</div><p th:if="${veterinaria.paginaWeb}" th:text="${veterinaria.paginaWeb}"></p><p>Consulta la agenda y los pacientes vinculados a esta clínica desde el menú.</p></article></div></div></section></main><div th:replace="~{layout/dashboard-shell :: scripts}"></div></body></html>
