<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - VetLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-body">

<aside th:replace="~{layout/dashboard-shell :: sidebar('Panel del veterinario', ${navItems}, ${seccionActiva})}"></aside>

<main class="main-content">
    <header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Buscar pacientes, citas...')}"></header>

    <section class="container">
        <div class="vl-section vl-section-active">
            <div class="welcome-header reveal active">
                <h1 th:text="'Bienvenido, Dr(a). ' + ${usuario.apellido}">Dashboard</h1>
                <p th:text="${veterinaria != null ? 'Trabajas en ' + veterinaria.nombre : 'Este es el resumen de tu actividad clínica.'}">Resumen</p>
            </div>

            <div class="stats-row">
                <div class="stat-card reveal active">
                    <div class="stat-info"><span class="stat-label">Citas de hoy</span><span class="stat-number" th:text="${statCitasHoy}">0</span></div>
                    <div class="stat-icon blue"><i class="fas fa-calendar-day"></i></div>
                </div>
                <div class="stat-card reveal active">
                    <div class="stat-info"><span class="stat-label">Próximas agendadas</span><span class="stat-number" th:text="${statProximas}">0</span></div>
                    <div class="stat-icon purple"><i class="fas fa-hourglass-half"></i></div>
                </div>
            </div>

            <div class="panels-grid">
                <div class="panel reveal active">
                    <div class="panel-header"><h3>Agenda de hoy</h3><a th:href="@{/reportes/citas}" class="view-all">Ver agenda completa</a></div>
                    <div>
                        <div class="list-item" th:each="c : ${citasHoy}">
                            <div class="pet-avatar"><i class="fas fa-paw"></i></div>
                            <div class="item-details"><strong th:text="${c.mascota.nombre}">Mascota</strong><span th:text="${c.hora} + ' · ' + ${c.servicio.nombreServicio}"></span></div>
                            <div class="item-action"><span class="vl-badge vl-badge-ok" th:text="${c.estado}"></span></div>
                        </div>
                        <p th:if="${#lists.isEmpty(citasHoy)}" style="color:#94a3b8; font-size:0.88rem; padding:10px 0;">No tienes citas para hoy.</p>
                    </div>
                </div>

                <div class="panel reveal active">
                    <div class="panel-header"><h3>Accesos rápidos</h3></div>
                    <div class="quick-actions-section" style="padding:0;">
                        <div class="actions-grid">
                            <a th:href="@{/historial/pacientes}" class="action-btn" style="text-decoration:none;"><i class="fas fa-dog"></i> Ver pacientes</a>
                            <a th:href="@{/reportes/citas}" class="action-btn" style="text-decoration:none;"><i class="fas fa-calendar-check"></i> Ver agenda</a>
                            <a th:if="${veterinaria != null}" th:href="@{'/directorio/' + ${veterinaria.idVeterinaria}}" class="action-btn" style="text-decoration:none;"><i class="fas fa-hospital"></i> Mi veterinaria</a>
                            <a th:unless="${veterinaria != null}" th:href="@{/directorio}" class="action-btn" style="text-decoration:none;"><i class="fas fa-hospital"></i> Directorio</a>
                            <a th:href="@{/emergencias}" class="action-btn" style="text-decoration:none;"><i class="fas fa-truck-medical"></i> Emergencias</a>
                            <a th:href="@{/chat}" class="action-btn" style="text-decoration:none;"><i class="fas fa-comments"></i> Chat</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:if="${param.proximamente}" style="position:fixed; bottom:20px; right:20px; background:#1e293b; color:#fff; padding:14px 20px; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:999;">
    <i class="fas fa-circle-info"></i> Este módulo estará disponible próximamente.
</div>
<div th:replace="~{layout/dashboard-shell :: scripts}"></div>
</body>
</html>
