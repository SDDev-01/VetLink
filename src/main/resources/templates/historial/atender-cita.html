<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atender cita | VetLink</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-body"><aside th:replace="~{layout/dashboard-shell :: sidebar('Atención clínica', ${navItems}, ${seccionActiva})}"></aside><main class="main-content"><header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Atención clínica')}"></header><section class="container"><div class="vl-section vl-section-active"><div class="vl-section-head"><div><h1 th:text="'Atender a '+${cita.mascota.nombre}"></h1><p th:text="${cita.servicio.nombreServicio+' · '+cita.fecha+' '+cita.hora}"></p></div></div><div class="vl-table-wrap" style="padding:28px"><form th:action="@{'/agenda/'+${cita.idCita}+'/atender'}" th:object="${form}" method="post"><input type="hidden" th:field="*{idMascota}"><div class="vl-form-grid"><div class="vl-form-section-title">Registro clínico</div><div class="vl-field vl-full"><label>Motivo de consulta</label><textarea th:field="*{motivoConsulta}" required></textarea></div><div class="vl-field vl-full"><label>Diagnóstico</label><textarea th:field="*{diagnostico}" required></textarea></div><div class="vl-field vl-full"><label>Observaciones y recomendaciones</label><textarea th:field="*{observaciones}"></textarea></div><div class="vl-field"><label>Próxima cita sugerida</label><input type="date" th:field="*{proximaCita}" required></div></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px"><a class="vl-btn vl-btn-ghost" th:href="@{'/agenda/'+${cita.idCita}}">Cancelar</a><button class="vl-btn vl-btn-primary">Guardar atención</button></div></form></div></div></section></main><div th:replace="~{layout/dashboard-shell :: scripts}"></div></body></html>
