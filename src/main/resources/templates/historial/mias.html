<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Clínico - VetLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-body">

<aside th:replace="~{layout/dashboard-shell :: sidebar('Panel del dueño', ${navItems}, ${seccionActiva})}"></aside>

<main class="main-content">
    <header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Buscar...')}"></header>

    <section class="container">
        <div class="vl-section vl-section-active">
            <div class="vl-section-head">
                <div><h1>Historial Clínico</h1><p>Consulta la ficha médica de todas tus mascotas.</p></div>
            </div>

            <div class="vl-table-wrap" th:if="${not #lists.isEmpty(historial)}" style="padding:0;">
                <div style="padding:20px; border-bottom:1px solid #eef2f7;" th:each="h : ${historial}">
                    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                        <strong th:text="${h.mascota.nombre}">Mascota</strong>
                        <span style="color:#94a3b8; font-size:0.85rem;" th:text="'Año ' + ${h.fechaConsulta} + ' · Dr(a). ' + ${h.veterinario.nombre} + ' ' + ${h.veterinario.apellido}"></span>
                    </div>
                    <p style="margin:8px 0 2px;"><strong>Motivo:</strong> <span th:text="${h.motivoConsulta}"></span></p>
                    <p style="margin:2px 0;"><strong>Diagnóstico:</strong> <span th:text="${h.diagnostico}"></span></p>
                </div>
            </div>

            <div class="vl-empty" th:if="${#lists.isEmpty(historial)}">
                <i class="fas fa-file-medical"></i>
                <h4>Sin historial clínico</h4>
                <p>Ninguna de tus mascotas tiene consultas registradas todavía.</p>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{layout/dashboard-shell :: scripts}"></div>
</body>
</html>
