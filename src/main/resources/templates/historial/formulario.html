<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar registro clínico | VetLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-body">
<aside th:replace="~{layout/dashboard-shell :: sidebar('Panel del veterinario', ${navItems}, ${seccionActiva})}"></aside>
<main class="main-content">
    <header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Buscar...')}"></header>
    <section class="container">
        <div class="vl-section vl-section-active">
            <div class="vl-section-head">
                <div><h1 th:text="'Editar registro clínico de ' + ${mascota.nombre}">Editar</h1>
                    <p>Solo el autor puede editar, durante las 24 horas siguientes al registro.</p></div>
            </div>
            <form class="vl-panel" th:action="@{'/historial/' + ${historialId} + '/editar'}" th:object="${form}" method="post"
                  data-confirm="Se modificará el registro clínico. Quedará constancia en la auditoría." data-confirm-title="¿Guardar los cambios?" data-confirm-ok="Guardar">
                <input type="hidden" th:field="*{idMascota}">
                <div class="vl-form-grid">
                    <div class="vl-field">
                        <label for="tipoRegistro">Tipo de registro</label>
                        <select id="tipoRegistro" th:field="*{tipoRegistro}">
                            <option value="CONSULTA">Consulta general</option>
                            <option value="CONTROL">Control veterinario</option>
                            <option value="PROCEDIMIENTO">Procedimiento clínico</option>
                            <option value="LABORATORIO">Resultados de laboratorio</option>
                            <option value="VACUNACION">Registro de vacunación</option>
                            <option value="URGENCIA">Atención de urgencia</option>
                        </select>
                    </div>
                    <div class="vl-field">
                        <label for="proximaCita">Próximo control (opcional)</label>
                        <input type="date" id="proximaCita" th:field="*{proximaCita}" data-no-pasado>
                        <span class="vl-field-error" th:if="${#fields.hasErrors('proximaCita')}" th:errors="*{proximaCita}"></span>
                    </div>
                    <div class="vl-field" style="grid-column:1/-1"><label for="motivoConsulta">Motivo de consulta *</label>
                        <textarea id="motivoConsulta" th:field="*{motivoConsulta}" required maxlength="4000" rows="2"></textarea>
                        <span class="vl-field-error" th:if="${#fields.hasErrors('motivoConsulta')}" th:errors="*{motivoConsulta}"></span></div>
                    <div class="vl-field" style="grid-column:1/-1"><label for="antecedentes">Antecedentes</label>
                        <textarea id="antecedentes" th:field="*{antecedentes}" maxlength="4000" rows="2"></textarea></div>
                    <div class="vl-field"><label for="temperatura">Temperatura (°C)</label>
                        <input type="number" step="0.1" min="30" max="45" id="temperatura" th:field="*{temperatura}"></div>
                    <div class="vl-field"><label for="pesoKg">Peso (kg)</label>
                        <input type="number" step="0.01" min="0.01" max="1500" id="pesoKg" th:field="*{pesoKg}"></div>
                    <div class="vl-field"><label for="frecuenciaCardiaca">Frecuencia cardiaca (lpm)</label>
                        <input type="number" min="1" max="400" id="frecuenciaCardiaca" th:field="*{frecuenciaCardiaca}"></div>
                    <div class="vl-field"><label for="frecuenciaRespiratoria">Frecuencia respiratoria (rpm)</label>
                        <input type="number" min="1" max="200" id="frecuenciaRespiratoria" th:field="*{frecuenciaRespiratoria}"></div>
                    <div class="vl-field" style="grid-column:1/-1"><label for="evaluacionClinica">Evaluación clínica</label>
                        <textarea id="evaluacionClinica" th:field="*{evaluacionClinica}" maxlength="4000" rows="2"></textarea></div>
                    <div class="vl-field" style="grid-column:1/-1"><label for="hallazgos">Hallazgos</label>
                        <textarea id="hallazgos" th:field="*{hallazgos}" maxlength="4000" rows="2"></textarea></div>
                    <div class="vl-field" style="grid-column:1/-1"><label for="diagnostico">Diagnóstico *</label>
                        <textarea id="diagnostico" th:field="*{diagnostico}" required maxlength="4000" rows="2"></textarea>
                        <span class="vl-field-error" th:if="${#fields.hasErrors('diagnostico')}" th:errors="*{diagnostico}"></span></div>
                    <div class="vl-field" style="grid-column:1/-1"><label for="tratamiento">Tratamiento</label>
                        <textarea id="tratamiento" th:field="*{tratamiento}" maxlength="4000" rows="2"></textarea></div>
                    <div class="vl-field" style="grid-column:1/-1"><label for="medicamentosIndicados">Medicamentos</label>
                        <textarea id="medicamentosIndicados" th:field="*{medicamentosIndicados}" maxlength="4000" rows="2"></textarea></div>
                    <div class="vl-field" style="grid-column:1/-1"><label for="recomendaciones">Recomendaciones</label>
                        <textarea id="recomendaciones" th:field="*{recomendaciones}" maxlength="4000" rows="2"></textarea></div>
                    <div class="vl-field" style="grid-column:1/-1"><label for="observaciones">Observaciones</label>
                        <textarea id="observaciones" th:field="*{observaciones}" maxlength="4000" rows="2"></textarea></div>
                </div>
                <div class="vl-row" style="justify-content:flex-end;margin-top:16px">
                    <a th:href="@{'/historial/documento/' + ${historialId}}" class="vl-btn vl-btn-ghost">Cancelar</a>
                    <button type="submit" class="vl-btn vl-btn-primary"><i class="fas fa-check" aria-hidden="true"></i> Guardar</button>
                </div>
            </form>
        </div>
    </section>
</main>
<div th:replace="~{layout/dashboard-shell :: scripts}"></div>
</body>
</html>
