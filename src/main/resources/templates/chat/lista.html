<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat | VetLink</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-body"><aside th:replace="~{layout/dashboard-shell :: sidebar('VetLink', ${navItems}, ${seccionActiva})}"></aside><main class="main-content"><header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Buscar contacto...')}"></header><section class="container"><div class="vl-section vl-section-active"><div class="vl-section-head"><div><h1>Chat</h1><p>Comunícate de forma segura dentro de VetLink.</p></div></div><div class="vl-card-grid"><article class="vl-entity-card" th:each="c:${conversaciones}"><div class="vl-entity-top"><div class="vl-entity-avatar">💬</div><div><div class="vl-entity-name" th:text="${c.usuarioA.idUsuario == usuario.idUsuario ? c.usuarioB.nombre + ' ' + c.usuarioB.apellido : c.usuarioA.nombre + ' ' + c.usuarioA.apellido}"></div><div class="vl-entity-sub">Conversación activa</div></div></div><a class="vl-btn vl-btn-primary" th:href="@{'/chat/'+${c.idConversacion}}">Abrir chat</a></article></div><div class="vl-table-wrap" style="padding:24px;margin-top:24px"><div class="vl-form-section-title">Iniciar conversación</div><div class="vl-card-grid"><form th:each="u:${contactos}" th:action="@{'/chat/nuevo/'+${u.idUsuario}}" method="post"><button class="vl-btn vl-btn-ghost" type="submit" th:text="${u.nombre+' '+u.apellido+' · '+u.rol}"></button></form></div></div></div></section></main><div th:replace="~{layout/dashboard-shell :: scripts}"></div></body></html>
