<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | VetLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-body">
<aside th:replace="~{layout/dashboard-shell :: sidebar('VetLink', ${navItems}, ${seccionActiva})}"></aside>
<main class="main-content">
    <header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Chat')}"></header>
    <section class="container">
        <div class="vl-section vl-section-active">
            <div class="vl-section-head">
                <div><h1 th:text="${tituloChat}">Contacto</h1>
                    <p th:text="${contacto.nombre} + ' ' + ${contacto.apellido}"></p></div>
                <a class="vl-btn vl-btn-ghost" th:href="@{/chat}"><i class="fas fa-arrow-left" aria-hidden="true"></i> Conversaciones</a>
            </div>
            <div th:replace="~{layout/dashboard-shell :: mensajes}"></div>
            <div class="vl-grid-2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)">
                <div th:replace="~{chat/fragmentos :: bandeja}"></div>
                <div class="vl-chat-panel" style="height:600px">
                    <div class="vl-chat-thread" id="hilo" aria-live="polite">
                        <div th:each="m : ${mensajes}" class="vl-chat-bubble-row" th:classappend="${m.remitente.idUsuario == usuario.idUsuario} ? ' mine' : ''">
                            <div class="vl-chat-bubble">
                                <span th:text="${m.contenido}"></span>
                                <small class="vl-chat-bubble-time" th:text="${@fmt.fechaHora(m.enviadoEn)} + (${m.remitente.idUsuario == usuario.idUsuario and m.leidoEn != null} ? ' · leído' : '')"></small>
                            </div>
                        </div>
                        <p class="vl-muted" th:if="${#lists.isEmpty(mensajes)}" style="text-align:center">Escribe el primer mensaje.</p>
                    </div>
                    <form class="vl-chat-input-row" th:action="@{'/chat/' + ${conversacion.idConversacion} + '/mensajes'}" method="post">
                        <label for="contenido" class="vl-sr-only">Mensaje</label>
                        <textarea id="contenido" name="contenido" required maxlength="2000" placeholder="Escribe un mensaje..."></textarea>
                        <button class="vl-btn vl-btn-primary" type="submit"><i class="fas fa-paper-plane" aria-hidden="true"></i> Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>
<script>var h = document.getElementById('hilo'); if (h) h.scrollTop = h.scrollHeight;</script>
<div th:replace="~{layout/dashboard-shell :: scripts}"></div>
</body>
</html>
