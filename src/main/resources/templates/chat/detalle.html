<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat | VetLink</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-body"><aside th:replace="~{layout/dashboard-shell :: sidebar('VetLink', ${navItems}, ${seccionActiva})}"></aside><main class="main-content"><header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Chat')}"></header><section class="container"><div class="vl-section vl-section-active"><div class="vl-section-head"><div><h1 th:text="${contacto.nombre+' '+contacto.apellido}">Contacto</h1><p th:text="${contacto.rol}"></p></div><a class="vl-btn vl-btn-ghost" th:href="@{/chat}">Volver</a></div><div class="vl-chat-panel" style="height:600px"><div class="vl-chat-thread"><div th:each="m:${mensajes}" class="vl-chat-bubble-row" th:classappend="${m.remitente.idUsuario==usuario.idUsuario?' mine':''}"><div class="vl-chat-bubble"><span th:text="${m.contenido}"></span><small class="vl-chat-bubble-time" th:text="${m.enviadoEn}"></small></div></div></div><form class="vl-chat-input-row" th:action="@{'/chat/'+${conversacion.idConversacion}+'/mensajes'}" method="post"><textarea name="contenido" required placeholder="Escribe un mensaje..."></textarea><button class="vl-btn vl-btn-primary" type="submit">Enviar</button></form></div></div></section></main><div th:replace="~{layout/dashboard-shell :: scripts}"></div></body></html>
