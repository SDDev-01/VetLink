<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda | VetLink</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="dashboard-body"><aside th:replace="~{layout/dashboard-shell :: sidebar('Agenda', ${navItems}, ${seccionActiva})}"></aside><main class="main-content"><header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Buscar cita...')}"></header><section class="container"><div class="vl-section vl-section-active"><div class="vl-section-head"><div><h1 th:text="${usuario.rol.name()=='VETERINARIO'?'Mi agenda clínica':'Agenda de la clínica'}"></h1><p>Calendario operativo con cupos, citas agendadas y atenciones.</p></div><a th:if="${usuario.rol.name()=='RECEPCIONISTA'}" th:href="@{/citas/recepcion/ofertar}" class="vl-btn vl-btn-primary">Ofertar cupo</a></div><div class="panels-grid"><div class="panel"><div id="agenda-calendar"></div></div><div class="panel"><h3>Agenda del día</h3><div id="agenda-list" class="vl-agenda-list"></div></div></div><div class="vl-table-wrap" style="margin-top:22px"><table class="vl-table"><thead><tr><th>Fecha</th><th>Hora</th><th>Paciente / cupo</th><th>Servicio</th><th>Veterinario</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="c:${citas}"><td th:text="${c.fecha}"></td><td th:text="${c.hora}"></td><td th:text="${c.mascota!=null?c.mascota.nombre:'Cupo disponible'}"></td><td th:text="${c.servicio.nombreServicio}"></td><td th:text="${c.veterinario.nombre+' '+c.veterinario.apellido}"></td><td><span class="vl-badge" th:text="${c.estado}"></span></td><td><a th:href="@{'/agenda/'+${c.idCita}}" class="vl-btn vl-btn-ghost vl-btn-sm">Detalle</a></td></tr></tbody></table></div></div></section></main>
<script th:inline="javascript">var VL_CITAS_AGENDA=/*[[${citasJson}]]*/[];</script><script th:src="@{/js/vl-calendar-lite.js}"></script><script>document.addEventListener('DOMContentLoaded',function(){var list=document.getElementById('agenda-list'),marks={};VL_CITAS_AGENDA.forEach(function(c){(marks[c.fecha]||(marks[c.fecha]=[])).push({cls:c.estado==='DISPONIBLE'?'warn':c.estado==='CANCELADA'?'danger':''});});VlCalendarLite.render('agenda-calendar',{marks:marks,onSelectDay:function(day){var items=VL_CITAS_AGENDA.filter(function(x){return x.fecha===day});list.innerHTML=items.length?items.map(function(i){return '<a class="vl-agenda-item" href="/agenda/'+i.idCita+'"><strong>'+i.hora+'</strong><span>'+i.servicio+' · '+i.mascota+'</span></a>'}).join(''):'<p class="vl-empty">Sin eventos para este día.</p>';}});});</script><div th:replace="~{layout/dashboard-shell :: scripts}"></div></body></html>
