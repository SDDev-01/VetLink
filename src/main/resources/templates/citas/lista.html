<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas - VetLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-body">
<aside th:replace="~{layout/dashboard-shell :: sidebar('Panel', ${navItems}, ${seccionActiva})}"></aside>
<main class="main-content">
    <header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Buscar...')}"></header>
    <section class="container">
        <div class="vl-section vl-section-active">
            <div class="vl-section-head">
                <div><h1 th:text="'Citas de ' + ${mascota.nombre}">Citas</h1></div>
                <div class="vl-section-actions">
                    <a th:href="@{'/mascotas/' + ${mascota.idMascota}}" class="vl-btn vl-btn-ghost"><i class="fas fa-arrow-left" aria-hidden="true"></i> Ficha</a>
                    <a th:if="${mascota.agendable}" th:href="@{'/citas/agendar/' + ${mascota.idMascota}}" class="vl-btn vl-btn-primary"><i class="fas fa-calendar-plus" aria-hidden="true"></i> Agendar cita</a>
                </div>
            </div>

            <div class="vl-alert vl-alert-ok" role="status" th:if="${param.agendada}"><i class="fas fa-circle-check" aria-hidden="true"></i>
                Solicitud enviada. El horario quedó reservado y la clínica debe confirmarlo.</div>
            <div class="vl-alert vl-alert-ok" role="status" th:if="${param.cancelada}"><i class="fas fa-circle-check" aria-hidden="true"></i>Cita cancelada.</div>
            <div th:replace="~{layout/dashboard-shell :: mensajes}"></div>

            <div class="vl-cita-list" th:unless="${#lists.isEmpty(citas)}">
                <a th:each="c : ${citas}" th:href="@{'/citas/' + ${c.idCita}}" class="vl-cita-card" th:classappend="'st-' + ${c.estado}">
                    <div class="vl-cita-hora"><span th:text="${@fmt.hora(c.hora)}"></span><small th:text="${@fmt.fecha(c.fecha)}"></small></div>
                    <div class="vl-cita-main">
                        <div class="vl-cita-titulo" th:text="${c.servicio.nombreServicio}"></div>
                        <div class="vl-cita-meta">
                            <span><i class="fas fa-hospital" aria-hidden="true"></i><span th:text="${c.veterinaria.nombre}"></span></span>
                            <span><i class="fas fa-user-doctor" aria-hidden="true"></i><span th:text="${c.veterinario.nombre} + ' ' + ${c.veterinario.apellido}"></span></span>
                            <span><i class="fas fa-hourglass" aria-hidden="true"></i><span th:text="${@fmt.duracion(c.duracionMin)}"></span></span>
                        </div>
                    </div>
                    <div class="vl-cita-side"><span th:replace="~{layout/dashboard-shell :: estado(${c.estado})}"></span>
                        <span class="vl-small vl-muted">Detalle <i class="fas fa-chevron-right" aria-hidden="true"></i></span></div>
                </a>
            </div>
            <div class="vl-panel vl-empty-state" th:if="${#lists.isEmpty(citas)}">
                <i class="fas fa-calendar-alt" aria-hidden="true"></i>Esta mascota no tiene citas registradas.
            </div>
        </div>
    </section>
</main>
<div th:replace="~{layout/dashboard-shell :: scripts}"></div>
</body>
</html>
