<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas - VetLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-body">

<aside th:replace="~{layout/dashboard-shell :: sidebar('Panel', ${navItems}, ${seccionActiva})}"></aside>

<main class="main-content">
    <header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Buscar...')}"></header>

    <section class="container">
        <div class="vl-section vl-section-active">
            <div class="vl-section-head">
                <div><h1 th:text="'Citas de ' + ${mascota.nombre}">Citas</h1></div>
                <div class="vl-section-actions" sec:authorize="hasRole('TUTOR')" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                    <a th:href="@{'/citas/agendar/' + ${mascota.idMascota}}" class="vl-btn vl-btn-primary"><i class="fas fa-calendar-plus"></i> Agendar cita</a>
                </div>
            </div>

            <p class="form-message" style="color:#16a34a" th:if="${param.agendada}">Cita agendada correctamente.</p>
            <p class="form-message" style="color:#16a34a" th:if="${param.cancelada}">Cita cancelada.</p>
            <p class="form-message" style="color:#dc2626" th:if="${errorGeneral}" th:text="${errorGeneral}"></p>

            <div class="vl-table-wrap">
                <table class="vl-table">
                    <thead><tr><th>Fecha</th><th>Hora</th><th>Servicio</th><th>Veterinaria</th><th>Veterinario</th><th>Estado</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${citas}">
                        <td th:text="${c.fecha}"></td>
                        <td th:text="${c.hora}"></td>
                        <td th:text="${c.servicio.nombreServicio}"></td>
                        <td th:text="${c.veterinaria.nombre}"></td>
                        <td th:text="${c.veterinario.nombre} + ' ' + ${c.veterinario.apellido}"></td>
                        <td><span class="vl-badge" th:classappend="${c.estado.name() == 'AGENDADA' ? 'vl-badge-ok' : (c.estado.name() == 'CANCELADA' ? 'vl-badge-danger' : 'vl-badge-warn')}" th:text="${c.estado}"></span></td>
                        <td>
                            <form th:if="${c.estado.name() == 'AGENDADA'}" th:action="@{'/citas/' + ${c.idCita} + '/cancelar'}" method="post"
                                  onsubmit="return confirm('¿Cancelar esta cita?');">
                                <input type="hidden" name="idMascota" th:value="${mascota.idMascota}">
                                <button type="submit" class="vl-btn vl-btn-danger vl-btn-sm">Cancelar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="vl-empty" th:if="${#lists.isEmpty(citas)}">
                    <i class="fas fa-calendar-alt"></i>
                    <h4>Sin citas</h4>
                    <p>Esta mascota no tiene citas registradas.</p>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{layout/dashboard-shell :: scripts}"></div>
</body>
</html>
