<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis citas | VetLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-body">
<aside th:replace="~{layout/dashboard-shell :: sidebar('Panel', ${navItems}, ${seccionActiva})}"></aside>
<main class="main-content">
    <header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Buscar cita...')}"></header>
    <section class="container">
        <div class="vl-section vl-section-active">
            <div class="vl-section-head">
                <div><h1>Mis citas</h1><p>Toca una cita para ver todos sus detalles.</p></div>
                <a th:href="@{/citas/agendar}" class="vl-btn vl-btn-primary"><i class="fas fa-plus" aria-hidden="true"></i> Agendar cita</a>
            </div>
            <div th:replace="~{layout/dashboard-shell :: mensajes}"></div>
            <div class="vl-alert vl-alert-ok" role="status" th:if="${param.cancelada}"><i class="fas fa-circle-check" aria-hidden="true"></i>Cita cancelada.</div>

            <div class="vl-grid-2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
                <div class="vl-panel">
                    <h3><i class="fas fa-calendar-day" aria-hidden="true"></i> Próximas</h3>
                    <div class="vl-cita-list" th:unless="${#lists.isEmpty(proximas)}">
                        <a th:each="c : ${proximas}" th:href="@{'/citas/' + ${c.idCita}}" class="vl-cita-card" th:classappend="'st-' + ${c.estado}">
                            <div class="vl-cita-hora"><span th:text="${@fmt.hora(c.hora)}">9:00 a. m.</span><small th:text="${@fmt.fechaCorta(c.fecha)}"></small></div>
                            <div class="vl-cita-main">
                                <div class="vl-cita-titulo" th:text="${c.mascota.nombre} + ' · ' + ${c.servicio.nombreServicio}"></div>
                                <div class="vl-cita-meta">
                                    <span><i class="fas fa-hospital" aria-hidden="true"></i><span th:text="${c.veterinaria.nombre}"></span></span>
                                    <span><i class="fas fa-user-doctor" aria-hidden="true"></i><span th:text="${c.veterinario.nombre} + ' ' + ${c.veterinario.apellido}"></span></span>
                                </div>
                            </div>
                            <div class="vl-cita-side"><span th:replace="~{layout/dashboard-shell :: estado(${c.estado})}"></span>
                                <span class="vl-small vl-muted">Ver detalle <i class="fas fa-chevron-right" aria-hidden="true"></i></span></div>
                        </a>
                    </div>
                    <div class="vl-empty-state" th:if="${#lists.isEmpty(proximas)}"><i class="fas fa-calendar-plus" aria-hidden="true"></i>No tienes citas próximas.</div>

                    <h3 style="margin-top:22px"><i class="fas fa-clock-rotate-left" aria-hidden="true"></i> Historial de citas</h3>
                    <div class="vl-cita-list" th:unless="${#lists.isEmpty(pasadas)}">
                        <a th:each="c : ${pasadas}" th:href="@{'/citas/' + ${c.idCita}}" class="vl-cita-card" th:classappend="'st-' + ${c.estado}">
                            <div class="vl-cita-hora"><span th:text="${@fmt.hora(c.hora)}"></span><small th:text="${@fmt.fecha(c.fecha)}"></small></div>
                            <div class="vl-cita-main">
                                <div class="vl-cita-titulo" th:text="${c.mascota.nombre} + ' · ' + ${c.servicio.nombreServicio}"></div>
                                <div class="vl-cita-meta"><span><i class="fas fa-hospital" aria-hidden="true"></i><span th:text="${c.veterinaria.nombre}"></span></span></div>
                            </div>
                            <div class="vl-cita-side"><span th:replace="~{layout/dashboard-shell :: estado(${c.estado})}"></span></div>
                        </a>
                    </div>
                    <p class="vl-muted" th:if="${#lists.isEmpty(pasadas)}">Aún no hay citas anteriores.</p>
                </div>
                <div class="vl-panel">
                    <h3><i class="fas fa-calendar" aria-hidden="true"></i> Calendario</h3>
                    <div id="cal-mias"></div>
                    <div id="dia-mias" class="vl-cita-list" style="margin-top:12px" aria-live="polite"></div>
                </div>
            </div>
        </div>
    </section>
</main>
<script th:inline="javascript">var VL_CITAS = /*[[${citasJson}]]*/ [];</script>
<script th:src="@{/js/vl-calendar-lite.js}"></script>
<script th:src="@{/js/vl-minical.js}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var lista = document.getElementById('dia-mias');
    var marcas = {};
    VL_CITAS.forEach(function (c) {
        (marcas[c.fecha] = marcas[c.fecha] || []).push({ cls: c.estado === 'CANCELADA' || c.estado === 'RECHAZADA' ? 'danger' : (c.estado === 'PENDIENTE' ? 'warn' : '') });
    });
    VlCalendarLite.render('cal-mias', { mini: true, marks: marcas, onSelectDay: function (dia) {
        var items = VL_CITAS.filter(function (x) { return x.fecha === dia; });
        lista.innerHTML = items.length ? items.map(function (i) {
            return '<a class="vl-cita-card st-' + vlEsc(i.estado) + '" href="/citas/' + i.idCita + '"><div class="vl-cita-hora">' + vlEsc(i.horaTexto) +
                '</div><div class="vl-cita-main"><div class="vl-cita-titulo">' + vlEsc(i.mascota) + '</div><div class="vl-cita-meta">' +
                vlEsc(i.servicio) + '</div></div><div class="vl-cita-side"><span class="vl-st ' + vlEsc(i.estadoClase) + '">' + vlEsc(i.estadoEtiqueta) + '</span></div></a>';
        }).join('') : '<p class="vl-muted">Sin citas este día.</p>';
    }});
});
</script>
<div th:replace="~{layout/dashboard-shell :: scripts}"></div>
</body>
</html>
