<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalle de cita | VetLink</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-body"><aside th:replace="~{layout/dashboard-shell :: sidebar('Agenda', ${navItems}, ${seccionActiva})}"></aside><main class="main-content"><header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Detalle')}"></header><section class="container"><div class="vl-section vl-section-active"><div class="vl-section-head"><div><h1>Detalle de cita</h1><p th:text="${cita.fecha+' · '+cita.hora}"></p></div><a th:href="@{/agenda}" class="vl-btn vl-btn-ghost">Volver</a></div><div class="vl-medrecord-grid"><article class="vl-medcard"><strong>Estado</strong><span class="vl-badge" th:text="${cita.estado}"></span></article><article class="vl-medcard"><strong>Servicio</strong><span th:text="${cita.servicio.nombreServicio}"></span></article><article class="vl-medcard"><strong>Veterinario</strong><span th:text="${cita.veterinario.nombre+' '+cita.veterinario.apellido}"></span></article><article class="vl-medcard" th:if="${cita.mascota!=null}"><strong>Paciente</strong><a th:href="@{'/historial/paciente/'+${cita.mascota.idMascota}}" th:text="${cita.mascota.nombre}"></a></article><article class="vl-medcard" th:if="${cita.mascota!=null}"><strong>Dueño</strong><span th:text="${cita.mascota.tutor.nombre+' '+cita.mascota.tutor.apellido}"></span></article></div><div th:if="${usuario.rol.name()=='VETERINARIO' and cita.estado.name()=='AGENDADA'}" style="margin-top:22px"><a class="vl-btn vl-btn-primary" th:href="@{'/agenda/'+${cita.idCita}+'/atender'}">Atender cita</a></div></div></section></main><div th:replace="~{layout/dashboard-shell :: scripts}"></div></body></html>
