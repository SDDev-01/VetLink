<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet de vacunas - VetLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-body">

<aside th:replace="~{layout/dashboard-shell :: sidebar('Panel', ${navItems}, ${seccionActiva})}"></aside>

<main class="main-content">
    <header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Buscar...')}"></header>

    <section class="container">
        <div class="vl-section vl-section-active">
            <div class="vl-section-head">
                <div><h1 th:text="'Carnet de vacunas de ' + ${mascota.nombre}">Carnet</h1></div>
            </div>

            <div class="vl-table-wrap">
                <table class="vl-table">
                    <thead><tr><th>Vacuna</th><th>Dosis</th><th>Fecha aplicación</th><th>Próxima dosis</th><th>Observaciones</th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${carnet}">
                        <td th:text="${c.vacuna.nombreVacuna}"></td>
                        <td th:text="${c.dosis}"></td>
                        <td th:text="${c.fechaAplicacion}"></td>
                        <td th:text="${c.proximaDosis}"></td>
                        <td th:text="${c.observaciones}"></td>
                    </tr>
                    </tbody>
                </table>
                <div class="vl-empty" th:if="${#lists.isEmpty(carnet)}">
                    <i class="fas fa-syringe"></i>
                    <h4>Sin vacunas registradas</h4>
                    <p>Esta mascota aún no tiene vacunas registradas por una veterinaria.</p>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{layout/dashboard-shell :: scripts}"></div>
</body>
</html>
