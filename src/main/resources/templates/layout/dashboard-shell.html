<!--/* Shell reutilizable del dashboard: sidebar + topbar + scripts comunes.
   Cada página define en su modelo: usuario, seccionActiva y navItems.
   La campana usa vlNotificaciones / vlNoLeidas (NotificacionesModelAdvice). */-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(rolTag, items, seccionActiva)" class="sidebar reveal active" aria-label="Menú principal">
    <div class="sidebar-brand">
        <div class="logo-icon"><i class="fas fa-paw" aria-hidden="true"></i></div>
        <span>VetLink</span>
    </div>

    <div class="sidebar-role-tag" th:text="${rolTag}">Panel</div>

    <nav class="nav-menu">
        <ul>
            <li th:each="item : ${items}"
                th:classappend="${item.key == seccionActiva} ? 'active' : ''"
                class="nav-item"
                th:attr="data-url=${item.url}">
                <a th:href="@{${item.url}}" style="color:inherit;text-decoration:none;display:flex;gap:12px;align-items:center;width:100%"
                   th:attr="aria-current=${item.key == seccionActiva} ? 'page' : null">
                    <i th:class="${item.icono}" aria-hidden="true"></i> <span th:text="${item.label}">Item</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="nav-item logout" style="border:none; width:100%; text-align:left; background:none; cursor:pointer;">
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Cerrar Sesión
            </button>
        </form>
    </div>
</aside>

<th:block th:fragment="scripts">
    <script th:src="@{/js/vl-validate.js}"></script>
    <script th:src="@{/js/vl-confirm.js}"></script>
    <script>
        (function () {
            var bell = document.getElementById('vl-notif-bell');
            if (!bell) return;
            var panel = document.getElementById('vl-notif-panel');
            var boton = bell.querySelector('button.action-circle');
            function cerrar() { panel.classList.remove('open'); if (boton) boton.setAttribute('aria-expanded', 'false'); }
            boton.addEventListener('click', function (e) {
                e.stopPropagation();
                var abierto = panel.classList.toggle('open');
                boton.setAttribute('aria-expanded', abierto ? 'true' : 'false');
            });
            document.addEventListener('click', function (e) { if (!bell.contains(e.target)) cerrar(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrar(); });
        })();
    </script>
</th:block>

<!--/* Campana: notificaciones persistentes del usuario + (opcional) avisos calculados por la página. */-->
<div th:fragment="campana(extras)" class="vl-bell" id="vl-notif-bell">
    <button type="button" class="action-circle" aria-haspopup="true" aria-expanded="false"
            th:attr="aria-label=${'Notificaciones' + ((vlNoLeidas ?: 0) > 0 ? ', ' + vlNoLeidas + ' sin leer' : '')}">
        <i class="far fa-bell" aria-hidden="true"></i>
        <span class="badge" th:text="${(vlNoLeidas ?: 0) + (extras == null ? 0 : #lists.size(extras))}">0</span>
    </button>
    <div class="vl-notif-panel" id="vl-notif-panel" role="region" aria-label="Notificaciones">
        <div class="vl-notif-head vl-row-between">
            <span>Notificaciones</span>
            <form th:if="${(vlNoLeidas ?: 0) > 0}" th:action="@{/notificaciones/leidas}" method="post">
                <button type="submit" class="vl-btn vl-btn-ghost vl-btn-sm">Marcar todo leído</button>
            </form>
        </div>
        <div th:each="n : ${vlNotificaciones}" class="vl-notif-item" th:classappend="${!n.leida} ? 'no-leida'">
            <i th:class="'fas ' + ${n.icono}" style="background:#dbeafe;color:#1d4ed8" aria-hidden="true"></i>
            <form th:action="@{'/notificaciones/' + ${n.idNotificacion} + '/abrir'}" method="post" style="flex:1">
                <button type="submit" class="vl-notif-link">
                    <span class="t" th:text="${n.titulo}">Título</span>
                    <span class="m" style="display:block" th:text="${n.mensaje}">Mensaje</span>
                    <span class="vl-small vl-muted" th:text="${@fmt.fechaHora(n.creadaEn)}"></span>
                </button>
            </form>
        </div>
        <th:block th:if="${extras != null}">
            <div th:each="n : ${extras}" class="vl-notif-item">
                <i th:class="'fas ' + ${n.icono}"
                   th:styleappend="${n.claseColor == 'vl-badge-danger' ? 'background:#fee2e2;color:#dc2626' : (n.claseColor == 'vl-badge-warn' ? 'background:#fef3c7;color:#b45309' : 'background:#dbeafe;color:#1d4ed8')}"
                   aria-hidden="true"></i>
                <span th:text="${n.texto}">Aviso</span>
            </div>
        </th:block>
        <div class="vl-notif-empty" th:if="${#lists.isEmpty(vlNotificaciones) and (extras == null or #lists.isEmpty(extras))}">
            No tienes notificaciones nuevas.
        </div>
    </div>
</div>

<header th:fragment="topbar(usuario, placeholder)" class="top-bar">
    <div class="top-bar-container">
        <div class="search-global" aria-hidden="true">
            <i class="fas fa-search"></i>
            <input type="text" th:placeholder="${placeholder} ?: 'Buscar...'" disabled tabindex="-1">
        </div>
        <div class="header-actions">
            <div th:replace="~{layout/dashboard-shell :: campana(null)}"></div>
            <div class="user-pill-wrapper">
                <div class="user-pill">
                    <div class="user-text">
                        <span class="username" th:text="${usuario.nombre} + ' ' + ${usuario.apellido}">Usuario</span>
                        <span class="email" th:text="${usuario.rol}">Rol</span>
                    </div>
                    <div class="avatar-wrapper">
                        <div class="avatar" th:text="${#strings.substring(usuario.nombre,0,1)} + ${#strings.substring(usuario.apellido,0,1)}">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!--/* Variante que además muestra avisos calculados por la página (citas próximas, vacunas). */-->
<header th:fragment="topbarNotificaciones(usuario, placeholder, notificaciones)" class="top-bar">
    <div class="top-bar-container">
        <div class="search-global" aria-hidden="true">
            <i class="fas fa-search"></i>
            <input type="text" th:placeholder="${placeholder} ?: 'Buscar...'" disabled tabindex="-1">
        </div>
        <div class="header-actions">
            <div th:replace="~{layout/dashboard-shell :: campana(${notificaciones})}"></div>
            <div class="user-pill-wrapper">
                <div class="user-pill">
                    <div class="user-text">
                        <span class="username" th:text="${usuario.nombre} + ' ' + ${usuario.apellido}">Usuario</span>
                        <span class="email" th:text="${usuario.rol}">Rol</span>
                    </div>
                    <div class="avatar-wrapper">
                        <div class="avatar" th:text="${#strings.substring(usuario.nombre,0,1)} + ${#strings.substring(usuario.apellido,0,1)}">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!--/* Mensajes flash comunes. */-->
<th:block th:fragment="mensajes">
    <div class="vl-alert vl-alert-ok" role="status" th:if="${mensajeOk}"><i class="fas fa-circle-check" aria-hidden="true"></i><span th:text="${mensajeOk}"></span></div>
    <div class="vl-alert vl-alert-err" role="alert" th:if="${errorGeneral}"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i><span th:text="${errorGeneral}"></span></div>
</th:block>

<!--/* Chip de estado de cita: texto + icono + color. */-->
<span th:fragment="estado(e)" class="vl-st" th:classappend="${e.clase}">
    <i th:class="'fas ' + ${e.icono}" aria-hidden="true"></i><span th:text="${e.etiqueta}">Estado</span>
</span>

</body>
</html>
