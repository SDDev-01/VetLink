<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergencias | VetLink</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="dashboard-body"><aside th:replace="~{layout/dashboard-shell :: sidebar('VetLink', ${navItems}, ${seccionActiva})}"></aside><main class="main-content"><header th:replace="~{layout/dashboard-shell :: topbar(${usuario}, 'Emergencias')}"></header><section class="container"><div class="vl-section vl-section-active"><div class="vl-emergency-banner"><i class="fas fa-truck-medical"></i><div class="txt"><h4>Centro de emergencias</h4><p>Las solicitudes se atienden según prioridad y disponibilidad clínica.</p></div></div><p class="form-message" th:if="${param.creada}" style="color:#15803d">Solicitud de emergencia enviada.</p><div th:if="${usuario.rol.name()=='TUTOR'}" class="vl-table-wrap" style="padding:24px;margin-bottom:24px"><div class="vl-form-section-title">Solicitar atención urgente</div><form th:action="@{/emergencias}" th:object="${form}" method="post"><div class="vl-form-grid"><div class="vl-field"><label>Mascota</label><select th:field="*{idMascota}" required><option value="">Selecciona</option><option th:each="m:${mascotas}" th:value="${m.idMascota}" th:text="${m.nombre}"></option></select></div><div class="vl-field"><label>Veterinaria</label><select th:field="*{idVeterinaria}" required><option value="">Selecciona</option><option th:each="v:${veterinarias}" th:value="${v.idVeterinaria}" th:text="${v.nombre}"></option></select></div><div class="vl-field"><label>Motivo</label><input th:field="*{motivo}" placeholder="Ej.: dificultad respiratoria" required></div><div class="vl-field"><label>Detalles</label><textarea th:field="*{detalle}" placeholder="Describe signos, tiempo de evolución y cualquier dato importante"></textarea></div></div><button class="vl-btn vl-btn-danger" type="submit" style="margin-top:16px">Enviar emergencia</button></form></div><div class="vl-section-head"><div><h1>Mis emergencias</h1></div></div><div th:unless="${usuario.rol.name()=='TUTOR'}" class="vl-section-head"><div><h1>Emergencias asignadas</h1><p>Gestiona el estado de los casos a tu cargo.</p></div></div><div class="vl-card-grid"><article class="vl-entity-card vl-emergency-card" th:each="e:${emergencias}"><div class="vl-entity-top"><div class="vl-entity-avatar">⚠️</div><div><div class="vl-entity-name" th:text="${e.mascota.nombre}"></div><div class="vl-entity-sub" th:text="${e.motivo+' · '+e.creadaEn}"></div></div></div><p th:text="${e.detalle}"></p><div class="vl-entity-meta"><span th:text="${e.veterinaria.nombre}"></span><span th:text="${e.estado}"></span><span th:if="${e.veterinario!=null}" th:text="${e.veterinario.nombre+' '+e.veterinario.apellido}"></span></div><form th:if="${usuario.rol.name()=='RECEPCIONISTA' and e.estado.name()=='PENDIENTE'}" th:action="@{'/emergencias/'+${e.idEmergencia}+'/asignar'}" method="post" style="display:flex;gap:8px"><select name="idVeterinario"><option th:each="v:${veterinarios}" th:value="${v.idUsuario}" th:text="${v.nombre+' '+v.apellido}"></option></select><button class="vl-btn vl-btn-primary">Asignar</button></form><form th:if="${usuario.rol.name()=='VETERINARIO'}" th:action="@{'/emergencias/'+${e.idEmergencia}+'/estado'}" method="post" style="display:flex;gap:8px"><select name="estado"><option th:each="s:${T(com.vetlink.emergencia.model.EstadoEmergencia).values()}" th:value="${s}" th:text="${s}" th:selected="${s==e.estado}"></option></select><button class="vl-btn vl-btn-primary">Actualizar</button></form></article></div><div class="vl-empty" th:if="${#lists.isEmpty(emergencias)}"><i class="fas fa-heart-pulse"></i><h4>Sin emergencias</h4><p>No hay casos para mostrar.</p></div></div></section></main><div th:replace="~{layout/dashboard-shell :: scripts}"></div></body></html>
