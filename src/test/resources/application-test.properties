# Perfil de pruebas: base H2 en memoria en modo MySQL.
# create-drop SOLO en pruebas; en la aplicacion real el esquema se gestiona con database/migrations.
spring.datasource.url=jdbc:h2:mem:vetlink;MODE=MySQL;DATABASE_TO_LOWER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
vetlink.uploads.dir=target/test-uploads
logging.level.com.vetlink=INFO
